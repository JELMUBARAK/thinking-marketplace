<div id="hl">
<style>
#hl .pipe{fill:none;stroke:var(--node-line);stroke-width:7;stroke-linecap:round}
#hl .flow{fill:none;stroke:var(--card);stroke-width:2.5;stroke-dasharray:4 14;animation:hl-run var(--hl-t,3s) linear infinite}
#hl .off .flow{animation:none;opacity:0}#hl .off .pipe{stroke:var(--muted);opacity:.45}
#hl .rad{fill:var(--bad);stroke:var(--bad-line);stroke-width:1.5}#hl .off .rad{fill:var(--card);stroke:var(--muted)}
#hl text{font:13px system-ui,sans-serif;fill:var(--muted)}
@keyframes hl-run{to{stroke-dashoffset:-36}}
</style>
<svg viewBox="0 0 640 270" width="100%" role="img" aria-label="A sealed loop of water pipes: a pump on the left pushes water round past two radiators connected side by side">
 <g id="hl-main" style="--hl-t:3s">
  <path class="pipe" d="M90 104V40H480M480 220H90V156"/>
  <path class="flow" d="M90 104V40H480M480 220H90V156"/>
 </g>
 <g id="hl-a" style="--hl-t:3s">
  <path class="pipe" d="M330 40V220"/><path class="flow" d="M330 40V220"/>
  <rect class="rad" x="304" y="92" width="52" height="76" rx="4"/>
  <path d="M316 98v64M330 98v64M344 98v64" stroke="var(--bad-line)" stroke-width="1" opacity=".5"/>
 </g>
 <g id="hl-b" class="off" style="--hl-t:3s">
  <path class="pipe" d="M480 40V220"/><path class="flow" d="M480 40V220"/>
  <rect class="rad" x="454" y="92" width="52" height="76" rx="4"/>
  <path d="M466 98v64M480 98v64M494 98v64" stroke="var(--bad-line)" stroke-width="1" opacity=".5"/>
 </g>
 <circle cx="90" cy="130" r="26" fill="var(--base)" stroke="var(--base-line)" stroke-width="2"/>
 <path d="M78 140l12-22 12 22z" fill="var(--base-line)"/>
 <text x="56" y="134" text-anchor="end">pump</text>
 <text x="362" y="134">radiator</text>
 <text x="512" y="134" id="hl-bl">valve shut</text>
 <text x="20" y="258" id="hl-read">Flow at the pump: 1 unit. Same flow all the way round; no water is used up.</text>
</svg>
<div style="text-align:center;font-size:14px">
<button id="hl-btn" type="button" style="font:inherit;padding:4px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer">Open the second radiator</button>
</div>
</div>
<script>
(function(){
 var open=false,b=document.getElementById('hl-btn');
 b.onclick=function(){
  open=!open;
  document.getElementById('hl-b').setAttribute('class',open?'':'off');
  document.getElementById('hl-main').style.setProperty('--hl-t',open?'1.7s':'3s');
  ['hl-a','hl-b'].forEach(function(id){document.getElementById(id).style.setProperty('--hl-t',open?'3.3s':'3s');});
  document.getElementById('hl-bl').textContent=open?'radiator':'valve shut';
  document.getElementById('hl-read').textContent=open
   ?'Flow at the pump: about 1.8 units, the sum of both branches (the pump’s own insides keep it under 2).'
   :'Flow at the pump: 1 unit. Same flow all the way round; no water is used up.';
  b.textContent=open?'Shut the second radiator':'Open the second radiator';
 };
})();
</script>
